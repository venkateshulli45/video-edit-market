<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1030"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="play" x1="18" y1="16" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Film strip notches top -->
  <rect x="10" y="10" width="6" height="5" rx="1.5" fill="#a855f7" opacity="0.5"/>
  <rect x="20" y="10" width="6" height="5" rx="1.5" fill="#a855f7" opacity="0.5"/>
  <rect x="30" y="10" width="6" height="5" rx="1.5" fill="#a855f7" opacity="0.5"/>
  <rect x="40" y="10" width="6" height="5" rx="1.5" fill="#a855f7" opacity="0.5"/>

  <!-- Film strip notches bottom -->
  <rect x="10" y="49" width="6" height="5" rx="1.5" fill="#ec4899" opacity="0.5"/>
  <rect x="20" y="49" width="6" height="5" rx="1.5" fill="#ec4899" opacity="0.5"/>
  <rect x="30" y="49" width="6" height="5" rx="1.5" fill="#ec4899" opacity="0.5"/>
  <rect x="40" y="49" width="6" height="5" rx="1.5" fill="#ec4899" opacity="0.5"/>

  <!-- Play button triangle -->
  <polygon
    points="24,20 24,44 46,32"
    fill="url(#play)"
    filter="url(#glow)"
  />
</svg>
